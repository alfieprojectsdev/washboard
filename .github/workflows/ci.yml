name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: washboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: washboard-app/package-lock.json
      - run: npm ci
      - run: npx eslint src --quiet
      - run: npm run typecheck
      # Tests run against PGlite (in-process Postgres); no database service needed.
      - run: npm test
      - run: npm run build
